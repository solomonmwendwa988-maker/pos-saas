<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#f6f7fb" />
    <title>Sokoni — Retail POS & Business Management</title>
    <meta
      name="description"
      content="Cloud POS and business management for Kenyan retailers."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS home-screen icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      sessionStorage.setItem('sokoni.splash.startedAt', String(Date.now()));
      sessionStorage.setItem('sokoni.splash.launched', '1');
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f6f7fb;
      }

      /* ---------- App root ----------
         Opacity-only transition — no transform, no will-change.
         A transform or will-change on #root would create a containing
         block for fixed-position descendants (the mobile nav), which
         made it drift during scroll. */
      #root {
        opacity: 0;
        transition: opacity 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      body.app-ready #root {
        opacity: 1;
      }

      /* ---------- Splash ---------- */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        background: #f6f7fb;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        opacity: 1;
        transition: opacity 900ms cubic-bezier(0.65, 0, 0.35, 1);
        pointer-events: auto;
      }
      body.app-ready #splash {
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- Logo mark ---------- */
      #splash .splash-mark {
        position: relative;
        width: 112px;
        height: 112px;
        border-radius: 32px;
        background: linear-gradient(135deg, #7c6cff 0%, #22d3ee 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 22px 60px rgba(109, 94, 252, 0.32),
          0 8px 22px rgba(34, 211, 238, 0.18),
          0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        animation: splashPop 1200ms cubic-bezier(0.34, 1.35, 0.64, 1) both;
      }
      #splash .splash-mark::before {
        content: '';
        position: absolute;
        inset: -18px;
        border-radius: 40px;
        background: linear-gradient(135deg, #7c6cff, #22d3ee);
        opacity: 0.18;
        filter: blur(26px);
        z-index: -1;
        animation: splashGlow 3s ease-in-out infinite;
      }
      #splash .splash-mark::after {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 40px;
        border: 1.5px solid rgba(124, 108, 255, 0.35);
        animation: splashRing 2200ms cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      #splash .splash-mark svg {
        width: 62px;
        height: 62px;
        display: block;
      }

      /* ---------- Progress bar ---------- */
      #splash .splash-bar {
        position: relative;
        width: 220px;
        height: 5px;
        border-radius: 999px;
        background: rgba(109, 94, 252, 0.12);
        overflow: hidden;
        animation: splashFadeUp 900ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both;
      }
      #splash .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #7c6cff, #22d3ee);
        box-shadow: 0 0 14px rgba(124, 108, 255, 0.55);
        animation: splashFill 2000ms cubic-bezier(0.45, 0, 0.2, 1) 700ms forwards;
      }

      @keyframes splashPop {
        0% {
          transform: scale(0.35) rotate(-10deg);
          opacity: 0;
        }
        55% {
          transform: scale(1.08) rotate(3deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0);
          opacity: 1;
        }
      }
      @keyframes splashGlow {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.95);
        }
        50% {
          opacity: 0.32;
          transform: scale(1.1);
        }
      }
      @keyframes splashRing {
        0% {
          transform: scale(0.95);
          opacity: 0.55;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      @keyframes splashFadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes splashFill {
        0% {
          width: 0;
        }
        15% {
          width: 12%;
        }
        35% {
          width: 30%;
        }
        60% {
          width: 55%;
        }
        80% {
          width: 82%;
        }
        100% {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::before,
        #splash *::after,
        #root {
          animation-duration: 0.001ms !important;
          transition-duration: 200ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 15h16l-1.6 12.2a2 2 0 0 1-2 1.8H15.6a2 2 0 0 1-2-1.8L12 15Z"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linejoin="round"
          />
          <path
            d="M16 15a4 4 0 0 1 8 0"
            stroke="#fff"
            stroke-width="2.2"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <div class="splash-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
